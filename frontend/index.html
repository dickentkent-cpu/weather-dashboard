<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M7 17a4 4 0 1 1 1.1-7.85A5 5 0 0 1 18 11a3.5 3.5 0 0 1-.5 6.9H7Z" fill="#8FB8FF"/>
                        <circle cx="16" cy="7" r="3" fill="#FFD166"/>
                    </svg>
                </span>
                <span class="brand-text">Weather<br>Dashboard</span>
            </div>

            <nav class="nav">
                <a class="nav-item active" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                    Dashboard
                </a>
                <a class="nav-item" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z"/></svg>
                    Favorites
                </a>
                <a class="nav-item" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                    History
                </a>
                <a class="nav-item" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.3l.06.06A1.65 1.65 0 0 0 9 4.6c.6-.25 1-.83 1-1.51V3a2 2 0 0 1 4 0v.09c0 .68.4 1.26 1 1.51.63.26 1.36.13 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06c-.46.46-.59 1.19-.33 1.82.25.6.83 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.68 0-1.26.4-1.51 1Z"/></svg>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main">
            <h1 class="page-title">Weather Dashboard</h1>

            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Masukin nama kota...">
                <button id="searchBtn">Search</button>
            </div>

            <div id="result">
                <div class="empty-state">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                        <path d="M7 17a4 4 0 1 1 1.1-7.85A5 5 0 0 1 18 11a3.5 3.5 0 0 1-.5 6.9H7Z" fill="#C7D6F2"/>
                    </svg>
                    <p>Cari kota untuk melihat cuacanya di sini.</p>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
